<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #06251c;
  color: #fff;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(201,162,39,0.12) 0, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(201,162,39,0.10) 0, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.top-gold {
  height: 10px;
  background: linear-gradient(90deg, #c9a227, #f6d365, #c9a227);
}

header {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 45px 20px;
  background: linear-gradient(180deg, #06251c, #0b3d2e);
  border-bottom: 6px solid #c9a227;
}

.header-inner {
  max-width: 900px;
  margin: auto;
  border: 3px solid #c9a227;
  border-radius: 20px;
  padding: 25px 15px;
  background: rgba(255,255,255,0.04);
}

.menu-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #c9a227;
  border: none;
  color: #06251c;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  font-size: 24px;
  cursor: pointer;
}

header h1 {
  font-family: 'Aref Ruqaa', serif;
  font-size: 34px;
  color: #c9a227;
  margin: 0;
  line-height: 1.8;
}

header p {
  margin: 12px 0 0;
  color: #e8e2c9;
  font-size: 16px;
}

main {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: 45px auto;
  padding: 0 15px;
}

.section-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 30px;
  color: #c9a227;
  text-align: center;
  margin-bottom: 30px;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 30px;
}

.book-card {
  background: #0b3d2e;
  border: 3px solid #c9a227;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
  box-shadow: 0 15px 35px rgba(0,0,0,0.35);
}

.book-icon {
  font-size: 65px;
  margin-bottom: 15px;
}

.book-card h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #c9a227;
  margin: 0 0 12px;
}

.book-card p {
  color: #e8e2c9;
  margin: 0 0 22px;
}

.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  text-decoration: none;
}

.read {
  background: #c9a227;
  color: #06251c;
}

.download {
  background: transparent;
  color: #c9a227;
  border: 2px solid #c9a227;
}

/* القائمة الجانبية الخفيفة */
.sidebar {
  position: fixed;
  top: 0;
  right: -320px;
  width: 300px;
  height: 100%;
  background: #e9f5ef;
  color: #06251c;
  padding: 25px 20px;
  transition: right 0.3s;
  z-index: 200;
  border-left: 5px solid #c9a227;
}

.sidebar.open {
  right: 0;
}

.sidebar h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #0b3d2e;
  margin: 0 0 20px;
}

.sidebar a {
  display: block;
  color: #06251c;
  text-decoration: none;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #c9a227;
}

.sidebar a:hover {
  background: #c9a227;
  color: #06251c;
}

.close-btn {
  background: transparent;
  border: none;
  color: #06251c;
  font-size: 26px;
  cursor: pointer;
  margin-bottom: 15px;
}

footer {
  position: relative;
  z-index: 1;
  background: #06251c;
  color: #e8e2c9;
  text-align: center;
  padding: 25px;
  margin-top: 60px;
  border-top: 6px solid #c9a227;
}
</style>
</head>

<body>

<div class="top-gold"></div>

<header>
  <button class="menu-btn" onclick="openMenu()">☰</button>

  <div class="header-inner">
    <h1>مَكْتَبَةُ اليَاسِرِيّ الإِلِكْتْرُونِيّةُ الرَّقْمِيّة</h1>
    <p>مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها</p>
  </div>
</header>

<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="closeMenu()">✕</button>

  <h2>القائمة</h2>

  <a href="#">الصفحة الرئيسية</a>
  <a href="#">أقسام المكتبة</a>
  <a href="#">الكتب</a>
  <a href="#">التواصل</a>
  <a href="#">تسجيل الدخول</a>
</div>

<main>

  <h2 class="section-title">الكتب المتاحة</h2>

  <div class="book-grid">

    <div class="book-card">
      <div class="book-icon">📖</div>
      <h2>الحدائق للاندلسي</h2>
      <p>كتاب إسلامي متاح للقراءة والتحميل.</p>

      <button class="btn read" onclick="window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank')">
        قراءة الكتاب
      </button>

      <button class="btn download" onclick="downloadBook()">
        تحميل الكتاب
      </button>
    </div>

  </div>

</main>

<footer>
  <p>مكتبة الياسري الإلكترونية الرقمية</p>
</footer>

<script>
function openMenu() {
  document.getElementById("sidebar").classList.add("open");
}

function closeMenu() {
  document.getElementById("sidebar").classList.remove("open");
}

function downloadBook() {
  window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank');
}
</script>

</body>
</html>
