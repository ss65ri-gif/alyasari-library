<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الياسري الإلكترونية الرقمية</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1e6;
      color: #2b2b2b;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    header {
      background: #14532d;
      color: #fff;
      padding: 25px 10px;
      border-radius: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .buttons {
      margin: 20px 0;
    }

    button {
      background: #14532d;
      color: #fff;
      border: none;
      padding: 12px 25px;
      margin: 5px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .book {
      background: #fff;
      border: 1px solid #d8d2c0;
      border-radius: 12px;
      padding: 20px;
      max-width: 500px;
      margin: 20px auto;
    }

    .book h2 {
      margin-top: 0;
      color: #14532d;
    }

    .status {
      margin-top: 20px;
      font-weight: bold;
      color: #14532d;
    }
  </style>
</head>

<body>

  <header>
    <h1>مكتبة الياسري الإلكترونية الرقمية</h1>
    <p>البصرة، العراق</p>
  </header>

  <div class="buttons">
    <button onclick="changeLanguage()">English</button>
    <button onclick="login()">تسجيل الدخول</button>
  </div>

  <div class="book">
    <h2>الحدائق للاندلسي</h2>
    <p>كتاب علمي شيعي متاح للقراءة، والتحميل متاح للمسجلين فقط.</p>
    <button onclick="downloadBook()">تحميل الكتاب</button>
  </div>

  <p class="status" id="status">لم تسجل الدخول بعد.</p>

  <p>
    الهاتف / واتساب: 07705677595<br>
    البريد الإلكتروني: ss65ri@gmail.com
  </p>

  <script>
    let loggedIn = false;
    let isArabic = true;

    function changeLanguage() {
      isArabic = !isArabic;

      if (isArabic) {
        document.documentElement.dir = "rtl";
        document.title = "مكتبة الياسري الإلكترونية الرقمية";
        document.querySelector("h1").textContent = "مكتبة الياسري الإلكترونية الرقمية";
        document.querySelector(".book h2").textContent = "الحدائق للاندلسي";
        document.querySelector(".book p").textContent = "كتاب علمي شيعي متاح للقراءة، والتحميل متاح للمسجلين فقط.";
        document.querySelector(".buttons button:nth-child(2)").textContent = "تسجيل الدخول";
        document.querySelector(".book button").textContent = "تحميل الكتاب";
      } else {
        document.documentElement.dir = "ltr";
        document.title = "Al-Yasari Digital Electronic Library";
        document.querySelector("h1").textContent = "Al-Yasari Digital Electronic Library";
        document.querySelector(".book h2").textContent = "Al-Hadaeq by Al-Andalusi";
        document.querySelector(".book p").textContent = "A Shia scholarly book available for reading. Download is available for registered users only.";
        document.querySelector(".buttons button:nth-child(2)").textContent = "Log in";
        document.querySelector(".book button").textContent = "Download book";
      }
    }

    function login() {
      if (loggedIn) {
        loggedIn = false;
        document.getElementById("status").textContent = "تم تسجيل الخروج.";
        document.querySelector(".buttons button:nth-child(2)").textContent = "تسجيل الدخول";
        return;
      }

      const email = prompt("أدخل بريدك الإلكتروني:");

      if (email && email.includes("@")) {
        loggedIn = true;
        document.getElementById("status").textContent = "تم تسجيل الدخول بنجاح.";
        document.querySelector(".buttons button:nth-child(2)").textContent = "تسجيل الخروج";
      } else {
        alert("الرجاء إدخال بريد إلكتروني صحيح.");
      }
    }

    function downloadBook() {
      if (!loggedIn) {
        alert("التحميل متاح للمسجلين فقط.");
        return;
      }

      alert("تم تفعيل التحميل. سنربطه بملف Supabase في الخطوة التالية.");
    }
  </script>

</body>
</html>
