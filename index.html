<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الياسري الإلكترونية الرقمية</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5efe0; color: #2b2b2b; margin: 0; }
    header { background: #14532d; color: #fff; padding: 20px; text-align: center; }
    nav { background: #0f3d22; padding: 10px; text-align: center; }
    nav button { background: #d4af37; border: none; padding: 8px 16px; margin: 4px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    main { padding: 20px; }
    .book { background: #fff; border: 1px solid #d4af37; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .book h3 { color: #14532d; margin: 0 0 8px; }
    button { background: #14532d; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    footer { background: #14532d; color: #fff; padding: 16px; text-align: center; }
    a { color: #d4af37; }
  </style>
</head>
<body>

<header>
  <h1 id="siteTitle">مكتبة الياسري الإلكترونية الرقمية</h1>
</header>

<nav>
  <button onclick="setLanguage('ar')">العربية</button>
  <button onclick="setLanguage('en')">English</button>
  <button id="loginButton" onclick="toggleLogin()">تسجيل الدخول</button>
</nav>

<main>
  <div class="book">
    <h3 id="book1Title">الحدائق للاندلسي</h3>
    <p id="book1Desc">كتاب علمي شيعي متاح للقراءة، والتحميل متاح للمسجلين فقط.</p>
    <button onclick="downloadBook('hadaiq.pdf')">تحميل الكتاب</button>
  </div>
</main>

<footer>
  <p>البصرة، العراق</p>
  <p>الهاتف / واتساب: 07705677595</p>
  <p>البريد الإلكتروني: ss65ri@gmail.com</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function setLanguage(lang) {
    const t = document.getElementById("siteTitle");
    const b1 = document.getElementById("book1Title");
    const d1 = document.getElementById("book1Desc");
    const login = document.getElementById("loginButton");

    if (lang === "ar") {
      document.documentElement.dir = "rtl";
      t.textContent = "مكتبة الياسري الإلكترونية الرقمية";
      b1.textContent = "الحدائق للاندلسي";
      d1.textContent = "كتاب علمي شيعي متاح للقراءة، والتحميل متاح للمسجلين فقط.";
      login.textContent = "تسجيل الدخول";
    } else {
      document.documentElement.dir = "ltr";
      t.textContent = "Al-Yasari Digital Electronic Library";
      b1.textContent = "Al-Hadaeq by Al-Andalusi";
      d1.textContent = "A Shia scholarly book available for reading. Download is available for registered users only.";
      login.textContent = "Log in";
    }
  }

  function toggleLogin() {
    if (localStorage.getItem("alyasari_user")) {
      localStorage.removeItem("alyasari_user");
      alert("تم تسجيل الخروج.");
    } else {
      const email = prompt("أدخل بريدك الإلكتروني:");
      if (email) {
        localStorage.setItem("alyasari_user", email);
        alert("تم تسجيل الدخول محليًا. التحميل متاح الآن.");
      }
    }
  }

  async function downloadBook(filePath) {
    if (!localStorage.getItem("alyasari_user")) {
      alert("التحميل متاح للمسجلين فقط.");
      return;
    }

    const { data, error } = await supabase
      .storage
      .from(BOOKS_BUCKET)
      .createSignedUrl(filePath, 300);

    if (error) {
      alert("تعذر فتح الكتاب. تأكد من صلاحيات Supabase.");
      console.error(error);
      return;
    }

    window.open(data.signedUrl, "_blank");
  }
</script>

</body>
</html>
