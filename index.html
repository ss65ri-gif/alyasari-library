<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #f7f5ef;
  color: #222;
}

.topbar {
  background: #0b3d2e;
  color: #fff;
  padding: 10px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 4px solid #c9a227;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-btn {
  background: #c9a227;
  border: none;
  color: #14352a;
  width: 42px;
  height: 42px;
  border-radius: 10px;
  font-size: 22px;
  cursor: pointer;
}

.topbar-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 22px;
  color: #c9a227;
}

.sidebar {
  position: fixed;
  top: 0;
  right: -300px;
  width: 270px;
  height: 100%;
  background: #0b3d2e;
  color: #fff;
  padding: 20px;
  transition: right 0.3s;
  z-index: 200;
  border-left: 4px solid #c9a227;
}

.sidebar.open {
  right: 0;
}

.sidebar h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #c9a227;
  margin: 0 0 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
}

.sidebar a:hover {
  background: #c9a227;
  color: #14352a;
}

.close-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  margin-bottom: 15px;
}

header {
  background: #0b3d2e;
  color: #fff;
  padding: 30px 20px;
  text-align: center;
  border-bottom: 4px solid #c9a227;
  margin-top: 70px;
}

header h1 {
  font-family: 'Aref Ruqaa', serif;
  font-size: 34px;
  color: #c9a227;
  margin: 0 0 10px;
}

header p {
  margin: 0;
  color: #e8e2c9;
}

main {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: #fff;
  border-top: 5px solid #c9a227;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #0b3d2e;
  margin: 0 0 10px;
}

p {
  color: #556;
  margin: 0 0 20px;
}

button {
  display: block;
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.read {
  background: #14523c;
  color: #fff;
}

.download {
  background: #c9a227;
  color: #14352a;
}

footer {
  background: #0b3d2e;
  color: #e8e2c9;
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  border-top: 4px solid #c9a227;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="topbar-right">
    <button class="menu-btn" onclick="openMenu()">☰</button>
    <div class="topbar-title">مكتبة الياسري</div>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="closeMenu()">✕</button>

  <h2>القائمة</h2>

  <a href="#">الصفحة الرئيسية</a>
  <a href="#">أقسام المكتبة</a>
  <a href="#">الكتب</a>
  <a href="#">التواصل</a>
  <a href="#">تسجيل الدخول</a>
</div>

<header>
  <h1>مكتبة الياسري الإلكترونية الرقمية</h1>
  <p>مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها</p>
</header>

<main>

  <div class="card">
    <h2>الحدائق للاندلسي</h2>
    <p>كتاب إسلامي متاح للقراءة والتحميل.</p>

    <button class="read" onclick="window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank')">
      قراءة الكتاب
    </button>

    <button class="download" onclick="downloadBook()">
      تحميل الكتاب
    </button>
  </div>

</main>

<footer>
  <p>مكتبة الياسري الإلكترونية الرقمية</p>
</footer>

<script>
function openMenu() {
  document.getElementById("sidebar").classList.add("open");
}

function closeMenu() {
  document.getElementById("sidebar").classList.remove("open");
}

function downloadBook() {
  window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank');
}
</script>

</body>
</html>
