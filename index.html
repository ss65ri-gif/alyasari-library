<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Cairo', sans-serif;
}

body {
  background: #f7f5ef;
  color: #222;
}

.topbar {
  background: #0b3d2e;
  color: #fff;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 4px solid #c9a227;
  position: fixed;
  top: 0;
  right: 0;
  left: 0;
  z-index: 100;
}

.topbar-title {
  font-family: 'Amiri', serif;
  font-size: 20px;
  font-weight: bold;
}

.topbar-buttons {
  display: flex;
  gap: 10px;
}

.icon-btn {
  background: #c9a227;
  border: none;
  color: #14352a;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
}

.menu-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
}

.sidebar {
  position: fixed;
  top: 0;
  right: -300px;
  width: 280px;
  height: 100%;
  background: #0b3d2e;
  color: #fff;
  padding: 25px 20px;
  transition: right 0.3s;
  z-index: 200;
  border-left: 4px solid #c9a227;
}

.sidebar.open {
  right: 0;
}

.sidebar h2 {
  font-family: 'Amiri', serif;
  color: #c9a227;
  margin-bottom: 20px;
}

.sidebar a {
  display: block;
  color: #fff;
  text-decoration: none;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
}

.sidebar a:hover {
  background: #c9a227;
  color: #14352a;
}

.close-sidebar {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  margin-bottom: 15px;
}

main {
  padding-top: 100px;
  max-width: 1000px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
}

.hero {
  background: #fff;
  border-top: 5px solid #c9a227;
  border-radius: 20px;
  padding: 40px 20px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  margin-bottom: 40px;
}

.hero h1 {
  font-family: 'Amiri', serif;
  font-size: 32px;
  color: #0b3d2e;
  margin-bottom: 10px;
}

.hero p {
  color: #556;
}

.search-box {
  margin-top: 20px;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 13px;
  border: 2px solid #c9a227;
  border-radius: 30px;
  font-size: 16px;
}

.section-title {
  font-family: 'Amiri', serif;
  font-size: 26px;
  color: #0b3d2e;
  text-align: center;
  margin-bottom: 25px;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.book-card {
  background: #fff;
  border-top: 5px solid #c9a227;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.book-icon {
  font-size: 55px;
  margin-bottom: 15px;
}

.book-card h2 {
  font-family: 'Amiri', serif;
  color: #0b3d2e;
  margin-bottom: 10px;
}

.book-card p {
  color: #556;
  margin-bottom: 20px;
}

.btn {
  display: block;
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  text-decoration: none;
}

.read-btn {
  background: #14523c;
  color: #fff;
}

.download-btn {
  background: #c9a227;
  color: #14352a;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 300;
}

.modal-content {
  background: #fff;
  padding: 30px;
  border-radius: 18px;
  width: 90%;
  max-width: 380px;
  text-align: center;
  border-top: 5px solid #c9a227;
}

.modal-content h2 {
  font-family: 'Amiri', serif;
  color: #0b3d2e;
  margin-bottom: 15px;
}

.modal-content input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 10px;
}

.modal-content button {
  width: 100%;
  padding: 12px;
  background: #14523c;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
}

.close-btn {
  background: #999 !important;
  color: #fff !important;
}

.top-btn {
  position: fixed;
  bottom: 25px;
  left: 25px;
  background: #c9a227;
  color: #14352a;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
  display: none;
  z-index: 150;
}
