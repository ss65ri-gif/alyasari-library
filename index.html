<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية الرقمية</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Tahoma", "Arial", sans-serif;
  background: #f4f1ea;
  color: #222;
  min-height: 100vh;
}

header {
  background: #1f4e3d;
  color: #fff;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  font-size: 26px;
  margin-bottom: 8px;
}

header p {
  font-size: 15px;
  opacity: .9;
}

#tools {
  position: fixed;
  top: 12px;
  left: 12px;
  display: flex;
  gap: 10px;
  z-index: 1000;
}

#tools button {
  width: 46px;
  height: 46px;
  border: none;
  border-radius: 50%;
  background: #14532d;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}

main {
  max-width: 900px;
  margin: 25px auto;
  padding: 0 15px;
}

.card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card h2 {
  color: #1f4e3d;
  margin-bottom: 12px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  margin-bottom: 12px;
  font-size: 16px;
}

button.main-btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #1f4e3d;
  color: #fff;
  font-size: 17px;
  cursor: pointer;
}

.book {
  display: block;
  background: #eef6f1;
  color: #1f4e3d;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  text-decoration: none;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 20px;
  color: #666;
  font-size: 14px;
}

.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: all .8s ease;
}

.reveal.show {
  opacity: 1;
  transform: translateY(0);
}

body.dark {
  background: #101418;
  color: #e8e8e8;
}

body.dark .card {
  background: #171c21;
  color: #e8e8e8;
}

body.dark .book {
  background: #1d2a24;
  color: #cfe8dc;
}

body.english {
  direction: ltr;
  text-align: left;
}
</style>
</head>
<body>

<div id="tools">
  <button id="themeBtn">🌙</button>
  <button id="topBtn">⬆️</button>
  <button id="langBtn">🌐</button>
</div>

<header>
  <h1 id="siteTitle">مكتبة الياسري الإلكترونية الرقمية</h1>
  <p id="siteDesc">مكتبة إلكترونية لقراءة الكتب والرسائل العلمية</p>
</header>

<main>
  <section class="card reveal" id="loginCard">
    <h2 id="loginTitle">الدخول بالبريد الإلكتروني</h2>
    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
    <button class="main-btn" id="loginBtn">دخول</button>
    <p id="loginMsg" style="margin-top:10px;"></p>
  </section>

  <section class="card reveal" id="booksCard" style="display:none;">
    <h2 id="booksTitle">الكتب المتوفرة</h2>

    <a class="book" href="https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf" target="_blank">
      📖 كتاب الحدائق
    </a>

  </section>
</main>

<footer>
  مكتبة الياسري الإلكترونية الرقمية
</footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

  var loginBtn = document.getElementById("loginBtn");
  var emailInput = document.getElementById("email");
  var loginMsg = document.getElementById("loginMsg");
  var booksCard = document.getElementById("booksCard");

  loginBtn.addEventListener("click", function () {
    var email = emailInput.value.trim();

    if (email === "") {
      loginMsg.textContent = "الرجاء إدخال البريد الإلكتروني";
      loginMsg.style.color = "red";
      return;
    }

    loginMsg.textContent = "تم الدخول بنجاح";
    loginMsg.style.color = "green";
    booksCard.style.display = "block";
  });

  document.getElementById("themeBtn").addEventListener("click", function () {
    document.body.classList.toggle("dark");
    this.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  });

  document.getElementById("topBtn").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.getElementById("langBtn").addEventListener("click", function () {
    document.body.classList.toggle("english");

    var english = document.body.classList.contains("english");

    document.getElementById("siteTitle").textContent = english
      ? "Al-Yasari Digital Electronic Library"
      : "مكتبة الياسري الإلكترونية الرقمية";

    document.getElementById("siteDesc").textContent = english
      ? "An electronic library for reading books and academic theses"
      : "مكتبة إلكترونية لقراءة الكتب والرسائل العلمية";

    document.getElementById("loginTitle").textContent = english
      ? "Sign in with email"
      : "الدخول بالبريد الإلكتروني";

    document.getElementById("booksTitle").textContent = english
      ? "Available Books"
      : "الكتب المتوفرة";

    emailInput.placeholder = english ? "Enter your email" : "أدخل بريدك الإلكتروني";
    loginBtn.textContent = english ? "Sign in" : "دخول";
  });

  var items = document.querySelectorAll(".reveal");
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add("show");
      }
    });
  }, { threshold: 0.15 });

  items.forEach(function (item, index) {
    item.style.transitionDelay = (index * 0.2) + "s";
    observer.observe(item);
  });

});
</script>

</body>
</html>
