<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #f7f5ef;
  color: #222;
}

header {
  background: #0b3d2e;
  color: #fff;
  padding: 25px 20px;
  text-align: center;
  border-bottom: 4px solid #c9a227;
}

header h1 {
  font-family: 'Amiri', serif;
  font-size: 30px;
  margin: 0 0 10px;
}

header p {
  margin: 0;
  color: #e8e2c9;
}

main {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 15px;
}

.card {
  background: #fff;
  border-top: 5px solid #c9a227;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  margin-bottom: 25px;
}

h2 {
  font-family: 'Amiri', serif;
  color: #0b3d2e;
  margin: 0 0 10px;
}

p {
  color: #556;
  margin: 0 0 20px;
}

button {
  display: block;
  width: 100%;
  padding: 13px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.read {
  background: #14523c;
  color: #fff;
}

.download {
  background: #c9a227;
  color: #14352a;
}

footer {
  background: #0b3d2e;
  color: #e8e2c9;
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  border-top: 4px solid #c9a227;
}
</style>
</head>

<body>

<header>
  <h1>مكتبة الياسري الإلكترونية الرقمية</h1>
  <p>مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها</p>
</header>

<main>

  <div class="card">
    <h2>الحدائق للاندلسي</h2>
    <p>كتاب إسلامي متاح للقراءة والتحميل.</p>

    <button class="read" onclick="window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank')">
      قراءة الكتاب
    </button>

    <button class="download" onclick="downloadBook()">
      تحميل الكتاب
    </button>
  </div>

</main>

<footer>
  <p>مكتبة الياسري الإلكترونية الرقمية</p>
</footer>

<script>
function downloadBook() {
  window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank');
}
</script>

</body>
</html>
