<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية</title>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #06251c;
  color: #fff;
}

.top-gold {
  height: 10px;
  background: linear-gradient(90deg, #c9a227, #f6d365, #c9a227);
}

header {
  text-align: center;
  padding: 45px 20px;
  background: linear-gradient(180deg, #06251c, #0b3d2e);
  border-bottom: 6px solid #c9a227;
  position: relative;
}

.header-inner {
  max-width: 900px;
  margin: auto;
  border: 3px solid #c9a227;
  border-radius: 20px;
  padding: 25px 15px;
  background: rgba(255,255,255,0.04);
}

.menu-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 12px;
  font-size: 22px;
  cursor: pointer;
  background: #c9a227;
  color: #06251c;
}

.fixed-buttons {
  position: fixed;
  top: 18px;
  left: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 300;
}

.theme-btn,
.top-btn,
.lang-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  font-size: 17px;
  cursor: pointer;
  background: #c9a227;
  color: #06251c;
}

header h1 {
  font-family: 'Aref Ruqaa', serif;
  font-size: 38px;
  color: #c9a227;
  margin: 0;
  line-height: 1.8;
}

header p {
  margin: 12px 0 0;
  color: #e8e2c9;
  font-size: 16px;
}

main {
  max-width: 1000px;
  margin: 45px auto;
  padding: 0 15px;
}

.section-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 30px;
  color: #c9a227;
  text-align: center;
  margin-bottom: 30px;
}

.empty-message {
  text-align: center;
  color: #e8e2c9;
  font-size: 18px;
  padding: 40px 20px;
  border: 2px dashed #c9a227;
  border-radius: 20px;
  background: #0b3d2e;
}

.sidebar {
  position: fixed;
  top: 0;
  right: -320px;
  width: 300px;
  height: 100%;
  background: #e9f5ef;
  color: #06251c;
  padding: 25px 20px;
  transition: right 0.3s;
  z-index: 200;
  border-left: 5px solid #c9a227;
}

.sidebar.open {
  right: 0;
}

.sidebar h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #0b3d2e;
  margin: 0 0 20px;
}

.sidebar a {
  display: block;
  color: #06251c;
  text-decoration: none;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #c9a227;
}

.close-btn {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #d32f2f;
  color: #ffffff;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  background: #06251c;
  color: #e8e2c9;
  text-align: center;
  padding: 25px;
  margin-top: 60px;
  border-top: 6px solid #c9a227;
}

body.night {
  background: #ffffff;
  color: #f5f5f5;
}

body.night header {
  background: #0a0a0a;
}

body.night .header-inner {
  background: #141414;
}

body.night .empty-message {
  background: #141414;
}

body.night footer {
  background: #0a0a0a;
}
</style>
</head>

<body>

<div class="top-gold"></div>

<div class="fixed-buttons">
  <button class="top-btn" type="button">⬆️</button>
  <button class="theme-btn" id="themeBtn" type="button">🌙</button>
  <button class="lang-btn" type="button">🌐</button>
</div>

<header>
  <button class="menu-btn" type="button">☰</button>

  <div class="header-inner">
    <h1>مكتبة الياسري الإلكترونية</h1>
    <p>مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها</p>
  </div>
</header>

<div class="sidebar" id="sidebar">
  <button class="close-btn" type="button">✕</button>

  <h2>القائمة</h2>

  <a href="#" id="homeLink">الصفحة الرئيسية</a>
  <a href="#" id="sectionsLink">أقسام المكتبة</a>
  <a href="#" id="booksLink">الكتب</a>
  <a href="#" id="contactLink">التواصل</a>
  <a href="#" id="loginLink">تسجيل الدخول</a>
</div>

<main>
  <h2 class="section-title">الكتب المتاحة</h2>

  <div class="empty-message">
    لا توجد كتب متاحة حاليًا.
  </div>
</main>

<footer>
  <p>مكتبة الياسري الإلكترونية</p>
</footer>

<script>
var menuButton = document.querySelector(".menu-btn");
var closeButton = document.querySelector(".close-btn");
var sidebar = document.getElementById("sidebar");
var themeButton = document.getElementById("themeBtn");
var languageButton = document.querySelector(".lang-btn");
var topButton = document.querySelector(".top-btn");

function openMenu() {
  sidebar.classList.add("open");
}

function closeMenu() {
  sidebar.classList.remove("open");
}

function toggleTheme() {
  var isNight = document.body.classList.toggle("night");

  if (isNight) {
    themeButton.textContent = "☀️";
  } else {
    themeButton.textContent = "🌙";
  }

  try {
    localStorage.setItem("theme", isNight ? "night" : "day");
  } catch (error) {
  }
}

function toggleLanguage() {
  var isEnglish = document.documentElement.lang === "ar";

  if (isEnglish) {
    document.documentElement.lang = "en";
    document.documentElement.dir = "ltr";

    document.querySelector(".header-inner h1").textContent = "Al-Yasiri Electronic Library";
    document.querySelector(".header-inner p").textContent = "An Islamic digital library for reading books";
    document.querySelector(".section-title").textContent = "Available Books";
    document.querySelector(".empty-message").textContent = "No books are available at the moment.";
    document.querySelector(".sidebar h2").textContent = "Menu";
    document.getElementById("homeLink").textContent = "Home";
    document.getElementById("sectionsLink").textContent = "Library Sections";
    document.getElementById("booksLink").textContent = "Books";
    document.getElementById("contactLink").textContent = "Contact";
    document.getElementById("loginLink").textContent = "Login";
    document.querySelector("footer p").textContent = "Al-Yasiri Electronic Library";
  } else {
    document.documentElement.lang = "ar";
    document.documentElement.dir = "rtl";

    document.querySelector(".header-inner h1").textContent = "مكتبة الياسري الإلكترونية";
    document.querySelector(".header-inner p").textContent = "مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها";
    document.querySelector(".section-title").textContent = "الكتب المتاحة";
    document.querySelector(".empty-message").textContent = "لا توجد كتب متاحة حاليًا.";
    document.querySelector(".sidebar h2").textContent = "القائمة";
    document.getElementById("homeLink").textContent = "الصفحة الرئيسية";
    document.getElementById("sectionsLink").textContent = "أقسام المكتبة";
    document.getElementById("booksLink").textContent = "الكتب";
    document.getElementById("contactLink").textContent = "التواصل";
    document.getElementById("loginLink").textContent = "تسجيل الدخول";
    document.querySelector("footer p").textContent = "مكتبة الياسري الإلكترونية";
  }
}

menuButton.addEventListener("click", openMenu);
closeButton.addEventListener("click", closeMenu);
themeButton.addEventListener("click", toggleTheme);
languageButton.addEventListener("click", toggleLanguage);

topButton.addEventListener("click", function () {
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

document.getElementById("homeLink").addEventListener("click", function (event) {
  event.preventDefault();
  closeMenu();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

document.getElementById("sectionsLink").addEventListener("click", function (event) {
  event.preventDefault();
  closeMenu();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

document.getElementById("booksLink").addEventListener("click", function (event) {
  event.preventDefault();
  closeMenu();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

document.getElementById("contactLink").addEventListener("click", function (event) {
  event.preventDefault();
  closeMenu();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});

document.getElementById("loginLink").addEventListener("click", function (event) {
  event.preventDefault();
  closeMenu();
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
});
