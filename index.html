<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الياسري الإلكترونية</title>

<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: #06251c;
  color: #fff;
}

.top-gold {
  height: 10px;
  background: linear-gradient(90deg, #c9a227, #f6d365, #c9a227);
}

header {
  text-align: center;
  padding: 45px 20px;
  background: linear-gradient(180deg, #06251c, #0b3d2e);
  border-bottom: 6px solid #c9a227;
  position: relative;
}

.header-inner {
  max-width: 900px;
  margin: auto;
  border: 3px solid #c9a227;
  border-radius: 20px;
  padding: 25px 15px;
  background: rgba(255,255,255,0.04);
}

.menu-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 12px;
  font-size: 22px;
  cursor: pointer;
  background: #c9a227;
  color: #06251c;
}

.theme-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  font-size: 17px;
  cursor: pointer;
  background: #c9a227;
  color: #06251c;
  z-index: 300;
}

header h1 {
  font-family: 'Aref Ruqaa', serif;
  font-size: 38px;
  color: #c9a227;
  margin: 0;
  line-height: 1.8;
}

header p {
  margin: 12px 0 0;
  color: #e8e2c9;
  font-size: 16px;
}

main {
  max-width: 1000px;
  margin: 45px auto;
  padding: 0 15px;
}

.section-title {
  font-family: 'Aref Ruqaa', serif;
  font-size: 30px;
  color: #c9a227;
  text-align: center;
  margin-bottom: 30px;
}

.book-card {
  background: #0b3d2e;
  border: 3px solid #c9a227;
  border-radius: 20px;
  padding: 30px;
  text-align: center;
}

.book-icon {
  font-size: 65px;
  margin-bottom: 15px;
}

.book-card h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #c9a227;
  margin: 0 0 12px;
}

.book-card p {
  color: #e8e2c9;
  margin: 0 0 22px;
}

.btn {
  display: block;
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.read {
  background: #c9a227;
  color: #06251c;
}

.download {
  background: transparent;
  color: #c9a227;
  border: 2px solid #c9a227;
}

.sidebar {
  position: fixed;
  top: 0;
  right: -320px;
  width: 300px;
  height: 100%;
  background: #e9f5ef;
  color: #06251c;
  padding: 25px 20px;
  transition: right 0.3s;
  z-index: 200;
  border-left: 5px solid #c9a227;
}

.sidebar.open {
  right: 0;
}

.sidebar h2 {
  font-family: 'Aref Ruqaa', serif;
  color: #0b3d2e;
  margin: 0 0 20px;
}

.sidebar a {
  display: block;
  color: #06251c;
  text-decoration: none;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: #ffffff;
  border: 1px solid #c9a227;
}

.close-btn {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: #d32f2f;
  color: #ffffff;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  background: #06251c;
  color: #e8e2c9;
  text-align: center;
  padding: 25px;
  margin-top: 60px;
  border-top: 6px solid #c9a227;
}

body.night {
  background: rgba(10, 20, 16, 0.35);
  color: #f5f5f5;
}

body.night header {
  background: rgba(11, 61, 46, 0.45);
}

body.night .header-inner {
  background: rgba(255,255,255,0.08);
}

body.night .book-card {
  background: rgba(11, 61, 46, 0.35);
}

body.night footer {
  background: rgba(11, 61, 46, 0.45);
}
</style>
</head>

<body>

<div class="top-gold"></div>

<button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>

<header>
  <button class="menu-btn" onclick="openMenu()">☰</button>

  <div class="header-inner">
    <h1>مكتبة الياسري الإلكترونية</h1>
    <p>مكتبة إسلامية رقمية لقراءة الكتب والاستفادة منها</p>
  </div>
</header>

<div class="sidebar" id="sidebar">
  <button class="close-btn" onclick="closeMenu()">✕</button>

  <h2>القائمة</h2>

  <a href="#">الصفحة الرئيسية</a>
  <a href="#">أقسام المكتبة</a>
  <a href="#">الكتب</a>
  <a href="#">التواصل</a>
  <a href="#">تسجيل الدخول</a>
</div>

<main>
  <h2 class="section-title">الكتب المتاحة</h2>

  <div class="book-card">
    <div class="book-icon">📖</div>
    <h2>الحدائق للاندلسي</h2>
    <p>كتاب إسلامي متاح للقراءة والتحميل.</p>

    <button class="btn read" onclick="window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank')">
      قراءة الكتاب
    </button>

    <button class="btn download" onclick="window.open('https://dwktxozijdycemdnywet.supabase.co/storage/v1/object/public/books/hadaiq.pdf','_blank')">
      تحميل الكتاب
    </button>
  </div>
</main>

<footer>
  <p>مكتبة الياسري الإلكترونية</p>
</footer>

<script>
function openMenu() {
  document.getElementById("sidebar").classList.add("open");
}

function closeMenu() {
  document.getElementById("sidebar").classList.remove("open");
}

function toggleTheme() {
  var body = document.body;
  var button = document.getElementById("themeBtn");

  body.classList.toggle("night");

  if (body.classList.contains("night")) {
    button.textContent = "☀️";
    localStorage.setItem("theme", "night");
  } else {
    button.textContent = "🌙";
    localStorage.setItem("theme", "day");
  }
}

var savedTheme = localStorage.getItem("theme");

if (savedTheme === "night") {
  document.body.classList.add("night");
  document.getElementById("themeBtn").textContent = "☀️";
}
</script>

</body>
</html>
